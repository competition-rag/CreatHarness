name: hotpot_agent_lifecycle
version: 2.0.0
description: 点餐系统基础流程
state:
  input_text:
    type: str
    required: true
    description: 用户原始输入
  intent:
    type: str
    required: false
    description: 用户意图，点餐或查询订单
  order_items:
    type: list[str]
    required: false
    description: 用户点餐的菜品列表
  query_order_id:
    type: str
    required: false
    description: 用户要查询的订单号
  router_message:
    type: str
    required: false
    description: 路由节点识别结果
  create_order_result:
    type: str
    required: false
    description: 创建订单后的结果提示
  created_order_id:
    type: str
    required: false
    description: 新建订单生成的订单号
  created_order_record:
    type: dict
    required: false
    description: 新建订单的完整记录
  query_order_result:
    type: str
    required: false
    description: 查询订单后的结果提示
  queried_order_record:
    type: dict
    required: false
    description: 查询到的订单完整记录
  final_answer:
    type: str
    required: false
    description: 最终返回给用户的结果
nodes:
- id: user_input
  type: user_input
  name: 用户输入
  handler: ''
  description: 当前流程的系统入口节点
  input:
    field: input_text
    type: str
  output:
    field: input_text
    type: str
  position:
    x: 80
    y: 160
  visible: true
- id: order_router
  type: agent
  name: 点餐路由
  handler: order_router_agent.order_router_agent
  input:
    field: input_text
    type: str
  output:
    fields:
      intent: intent
      order_items: order_items
      query_order_id: query_order_id
      router_message: router_message
    type: dict
  position:
    x: 340
    y: 220
- id: create_order
  type: rule_tool
  name: 创建订单
  handler: create_order_rule.create_order_rule
  tools:
  - create_order_record
  input:
    fields:
      input_text: input_text
      intent: intent
      order_items: order_items
    type: dict
  output:
    fields:
      create_order_result: create_order_result
      created_order_id: created_order_id
      created_order_record: created_order_record
    type: dict
  position:
    x: 660
    y: 120
- id: query_order
  type: rule_tool
  name: 查询订单
  handler: query_order_rule.query_order_rule
  tools:
  - query_order_record
  input:
    fields:
      intent: intent
      query_order_id: query_order_id
    type: dict
  output:
    fields:
      query_order_result: query_order_result
      queried_order_record: queried_order_record
    type: dict
  position:
    x: 660
    y: 340
- id: order_response
  type: agent
  name: 结果汇总
  handler: order_response_agent.order_response_agent
  input:
    fields:
      intent: intent
      order_items: order_items
      query_order_id: query_order_id
      router_message: router_message
      create_order_result: create_order_result
      query_order_result: query_order_result
    type: dict
  output:
    field: final_answer
    type: str
  position:
    x: 980
    y: 220
entrypoint: user_input
exitpoint: order_response
edges:
- id: e-user_input-order_router
  from: user_input
  to: order_router
- id: e-order_router-create_order
  from: order_router
  to: create_order
- id: e-order_router-query_order
  from: order_router
  to: query_order
- id: e-create_order-order_response
  from: create_order
  to: order_response
- id: e-query_order-order_response
  from: query_order
  to: order_response
